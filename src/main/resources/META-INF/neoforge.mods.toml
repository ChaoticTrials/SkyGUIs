modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod.license}"
issueTrackerURL = "${mod.issue_url}"

[[mods]]
modId = "${mod.modid}"
version = "${mod.version}"
displayName = "Sky GUIs"
displayURL = "https://wiki.chaotictrials.de/swl/sky-guis"
updateJSONURL = "https://assets.melanx.de/updates/sky-guis.json"
authors = "MelanX"
description = """
An addon for Skyblock Builder which provides GUIs to easily modify and view teams.
"""

[[dependencies.${ mod.modid }]]
modId = "neoforge"
type = "required"
versionRange = "[${mod.neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "minecraft"
type = "required"
versionRange = "[${mod.minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "skyblockbuilder"
type = "required"
versionRange = "[21.1.22,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "libx"
type = "required"
versionRange = "[26.1.2-7.0.3,)"
ordering = "AFTER"
side = "BOTH"
